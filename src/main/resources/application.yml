spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/futsaldb
    username: futsaluser
    password: futsalpass
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

