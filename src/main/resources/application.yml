server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:futsaldb}
    username: ${PGUSER:futsaluser}
    password: ${PGPASSWORD:futsalpass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  spring-doc:
    paths-to-match: /api/**/v1/**
    swagger-ui:
      use-root-path: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hour in milliseconds

cors:
  # em produção, defina CORS_ALLOWED_ORIGIN com a URL do frontend (ex: https://futsal-manager.vercel.app)
  allowed-origin: ${CORS_ALLOWED_ORIGIN:*}

app:
  # email da conta que pode ver estatísticas globais e dados entre times (defina em produção)
  platform-owner-email: ${PLATFORM_OWNER_EMAIL:}

