<div class="app-shell" [class.no-sidebar]="isPublic()">

  @if (!isPublic()) {
    <aside class="sidebar">
      <a class="sidebar-brand" routerLink="/dashboard">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3c1.5 2.5 2 5.5 2 9s-.5 6.5-2 9"/>
            <path d="M12 3c-1.5 2.5-2 5.5-2 9s.5 6.5 2 9"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Futsal</span>
          <span class="brand-sub">Manager</span>
        </div>
      </a>

      <nav class="sidebar-nav">
        <a routerLink="/dashboard" routerLinkActive="nav-active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Dashboard</span>
        </a>

        <div class="nav-section">Gestão</div>

        <a routerLink="/jogos" routerLinkActive="nav-active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3c1.5 2.5 2 5.5 2 9s-.5 6.5-2 9"/>
            <path d="M12 3c-1.5 2.5-2 5.5-2 9s.5 6.5 2 9"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
          </svg>
          <span>Jogos</span>
        </a>

        <a routerLink="/jogadores" routerLinkActive="nav-active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Jogadores</span>
        </a>

        <a routerLink="/eventos" routerLinkActive="nav-active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>Eventos</span>
        </a>

        <div class="nav-section">Financeiro</div>

        <a routerLink="/pagamentos" routerLinkActive="nav-active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <rect x="1" y="4" width="22" height="16" rx="2"/>
            <line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
          <span>Pagamentos</span>
        </a>

        <a routerLink="/despesas" routerLinkActive="nav-active" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span>Despesas</span>
        </a>

      </nav>

      <div class="sidebar-footer">
        @if (team()) {
          <div class="team-badge">
            <div class="team-avatar" [style.background]="corAvatar(team()!.nome)">
              {{ iniciais(team()!.nome) }}
            </div>
            <div class="team-info">
              <span class="team-name">{{ team()!.nome }}</span>
              <span class="team-plan">Plano Gratuito</span>
            </div>
          </div>
          <button class="btn-sair" (click)="sair()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sair
          </button>
        }
      </div>
    </aside>
  }

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
